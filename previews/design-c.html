<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Design C — Classic Paper</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&family=Marcellus&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
        font-family: 'Cormorant Garamond', serif;
        background: linear-gradient(160deg, #f4ede0 0%, #ece2d0 100%);
        color: #3d3345;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 24px 12px;
    }
    .card {
        position: relative;
        width: 100%;
        max-width: 460px;
        background:
            radial-gradient(400px 300px at 50% 0%, rgba(184,150,90,.08), transparent 60%),
            linear-gradient(180deg, #fdfaf0 0%, #f7f0dc 100%);
        border-radius: 4px;
        padding: 60px 40px;
        box-shadow: 0 25px 60px rgba(0,0,0,.16);
        text-align: center;
    }
    .card::before {
        content: '';
        position: absolute; inset: 14px;
        border: 1.5px solid #b8965a;
        border-radius: 2px;
        pointer-events: none;
    }
    .card::after {
        content: '';
        position: absolute; inset: 22px;
        border: 1px solid rgba(184,150,90,.4);
        pointer-events: none;
    }
    .corner {
        position: absolute;
        width: 70px; height: 70px;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g fill='none' stroke='%238a6a3a' stroke-width='1.3'><path d='M10 10 Q 50 10 50 50 M10 10 Q 10 50 50 50'/><circle cx='10' cy='10' r='3.5' fill='%23b8965a'/><path d='M20 20 Q 40 20 40 40' opacity='.6'/><path d='M30 10 Q 30 30 50 30' opacity='.5'/><circle cx='22' cy='22' r='2' fill='%23b8965a' opacity='.6'/><circle cx='35' cy='16' r='1.6' fill='%236f8a5e' opacity='.6'/></g></svg>");
        background-size: contain;
        background-repeat: no-repeat;
        z-index: 1;
    }
    .corner.tl { top: 18px; left: 18px; }
    .corner.tr { top: 18px; right: 18px; transform: scaleX(-1); }
    .corner.bl { bottom: 18px; left: 18px; transform: scaleY(-1); }
    .corner.br { bottom: 18px; right: 18px; transform: scale(-1,-1); }
    .inner { position: relative; z-index: 2; }

    .bismillah {
        font-family: 'Amiri', serif;
        font-size: 22px;
        color: #7a5a4a;
        margin-bottom: 4px;
    }
    .sub {
        font-family: 'Montserrat', sans-serif;
        letter-spacing: 5px;
        font-size: 10px;
        color: #a5854f;
        text-transform: uppercase;
        margin-bottom: 22px;
    }
    .ornament {
        display: flex; align-items: center; justify-content: center;
        gap: 12px; margin: 20px 0;
    }
    .ornament .line { flex: 0 0 60px; height: 1px; background: linear-gradient(90deg, transparent, #b8965a, transparent); }
    .ornament .icon { color: #a5854f; font-family: 'Amiri', serif; font-size: 16px; }

    .names {
        font-family: 'Great Vibes', cursive;
        font-size: clamp(44px, 13vw, 60px);
        color: #6f5b95;
        line-height: 1.05;
    }
    .weds {
        display: block;
        font-style: italic;
        color: #8a6a3a;
        font-size: 20px;
        margin: 4px 0;
    }
    .date {
        font-family: 'Marcellus', serif;
        font-size: 16px;
        letter-spacing: 5px;
        color: #6a4a5a;
        text-transform: uppercase;
    }
    .venue {
        font-family: 'Cormorant Garamond', serif;
        font-size: 17px;
        font-style: italic;
        color: #4a3540;
        margin-top: 8px;
    }
</style>
</head>
<body>
    <div class="card">
        <span class="corner tl"></span>
        <span class="corner tr"></span>
        <span class="corner bl"></span>
        <span class="corner br"></span>
        <div class="inner">
            <div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
            <div class="sub">Together with their families</div>
            <div class="ornament"><span class="line"></span><span class="icon">❁</span><span class="line"></span></div>
            <div class="names">
                Fayaz
                <span class="weds">weds</span>
                Saheba
            </div>
            <div class="ornament"><span class="line"></span><span class="icon">✦</span><span class="line"></span></div>
            <div class="date">18 November 2026</div>
            <div class="venue">Kings Lawn · Nagpur</div>
        </div>
    </div>
</body>
</html>
