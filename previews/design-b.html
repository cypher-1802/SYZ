<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Design B — Watercolor Hero</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&family=Marcellus&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
        font-family: 'Cormorant Garamond', serif;
        background: linear-gradient(160deg, #f7f2ea 0%, #eadfd3 100%);
        color: #3d3345;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 24px 12px;
    }
    .card {
        width: 100%;
        max-width: 460px;
        background: #fbf6ec;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 25px 60px rgba(0,0,0,.14);
        display: flex;
        flex-direction: column;
    }
    .hero {
        height: 240px;
        background: url('../waleema%20-theme.jpeg') center top / cover no-repeat;
        position: relative;
    }
    .hero::after {
        content: '';
        position: absolute; bottom: 0; left: 0; right: 0; height: 40px;
        background: linear-gradient(180deg, transparent, #fbf6ec);
    }
    .content {
        padding: 8px 30px 40px;
        text-align: center;
    }
    .bismillah {
        font-family: 'Amiri', serif;
        font-size: 20px;
        color: #7a5a4a;
        margin-bottom: 4px;
    }
    .sub {
        font-family: 'Montserrat', sans-serif;
        letter-spacing: 4px;
        font-size: 9px;
        color: #a5854f;
        text-transform: uppercase;
        margin-bottom: 20px;
    }
    .names {
        font-family: 'Great Vibes', cursive;
        font-size: clamp(42px, 12vw, 56px);
        color: #6f5b95;
        line-height: 1.05;
    }
    .weds {
        display: block;
        font-style: italic;
        color: #8a6a3a;
        font-size: 19px;
        margin: 4px 0;
    }
    .divider {
        display: flex; align-items: center; justify-content: center;
        gap: 10px; margin: 18px 0;
    }
    .divider .line { flex: 0 0 40px; height: 1px; background: #b8965a; }
    .divider .icon { color: #a5854f; font-size: 12px; }

    .date {
        font-family: 'Marcellus', serif;
        font-size: 15px;
        letter-spacing: 4px;
        color: #6a4a5a;
        text-transform: uppercase;
    }
    .venue {
        font-family: 'Cormorant Garamond', serif;
        font-size: 17px;
        font-style: italic;
        color: #4a3540;
        margin-top: 10px;
    }
</style>
</head>
<body>
    <div class="card">
        <div class="hero"></div>
        <div class="content">
            <div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
            <div class="sub">Together with their families</div>
            <div class="names">
                Fayaz
                <span class="weds">weds</span>
                Saheba
            </div>
            <div class="divider"><span class="line"></span><span class="icon">✦</span><span class="line"></span></div>
            <div class="date">18 November 2026</div>
            <div class="venue">Kings Lawn · Nagpur</div>
        </div>
    </div>
</body>
</html>
